<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cannery Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: tilted factory floor. Straight belts run into one giant can on the right; the red band on each belt is the pusher's reach. */
:root {
  color-scheme: light;
  --ink: #2f2a33;
  --cream: #fbf6e9;
  --leaf: #2f2a33;
  --leaf-deep: #2f2a33;
  --butter: #ffc93c;
  --coral: #ff8a6b;
  --display: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: #b7c97a; color: var(--ink); font-family: var(--body);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%; display: grid; grid-template-rows: auto auto 1fr auto;
  touch-action: none; cursor: pointer; position: relative;
}
#hud {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto auto; gap: 8px; align-items: center;
  padding-block: 7px; background: var(--cream); border-bottom: 3px solid var(--leaf);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stat { min-width: 0; }
.stat small { display: block; font-size: 11px; letter-spacing: .06em; opacity: .7; }
.stat b {
  display: block; font: 400 clamp(17px, 4.6vw, 23px)/1.15 var(--display);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
#money b { color: #cf8f20; }
#rep b { color: var(--coral); }
.pop { animation: pop .3s ease-out; }
@keyframes pop { 40% { transform: scale(1.14); } }
#hud .round {
  width: 40px; height: 40px; border: 2px solid var(--ink); border-radius: 50%;
  background: #fff; color: var(--ink); font: 500 15px var(--display); cursor: pointer;
}
#timebar { height: 6px; background: #dff2d8; }
#timefill { height: 100%; width: 100%; background: var(--leaf); transform-origin: left; }
#stage { min-height: 0; position: relative; overflow: hidden; }
canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#foot {
  display: flex; align-items: center; gap: 10px; min-height: 56px;
  background: var(--cream); border-top: 3px solid var(--leaf); padding-block: 4px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#face { width: 46px; height: 46px; flex: none; }
#shelfwrap { min-width: 0; flex: 1; }
#shelfwrap small { display: block; font-size: 11px; opacity: .75; margin-bottom: 3px; }
#goalbar { height: 12px; border: 2px solid var(--ink); border-radius: 7px; background: #fff; overflow: hidden; }
#goalfill { height: 100%; background: #6fd6c1; transform-origin: left; transform: scaleX(0); }
#overlay {
  position: absolute; inset: 0; z-index: 5; display: grid; place-items: center;
  background: #4f7f5a80; cursor: default; overflow: auto; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#card {
  width: 100%; max-width: 460px; box-sizing: border-box; padding: 18px;
  background: var(--cream); color: var(--ink); border: 3px solid var(--leaf); border-radius: 22px;
  box-shadow: 0 6px 0 var(--leaf-deep);
}
#eyebrow { font: 700 12px var(--body); letter-spacing: .1em; color: var(--coral); }
#ctitle { font: 400 clamp(28px, 8vw, 38px)/1.15 var(--display); margin: 2px 0 8px; text-wrap: balance; color: var(--leaf-deep); }
#cbody { font-size: 14px; line-height: 1.55; display: grid; gap: 4px; }
#cbody p { margin: 0; }
#cbody .row { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; }
#cbody .row b { font-family: var(--display); font-weight: 400; font-size: 17px; }
  min-width: 0; padding: 6px 4px; border: 2px solid #e6e0c8; border-radius: 16px; background: #fff;
  color: var(--ink); font: 400 12px/1.35 var(--body); cursor: pointer; text-align: center;
}
.pickcat .swatch { display: block; width: 44px; height: 14px; border: 3px solid var(--ink); border-radius: 5px; margin: 6px auto; }
.pickcat b { display: block; font: 400 17px var(--display); color: var(--leaf-deep); }
.pickcat em { display: block; font-style: normal; color: #cc6a5c; }
.pickcat[aria-pressed="true"] { border-color: var(--leaf); background: #eefae8; }
#btns { display: grid; gap: 8px; margin-top: 12px; }
#btns:empty { display: none; }
.btn {
  width: 100%; min-height: 48px; border: 0; border-radius: 14px; background: var(--butter); color: var(--ink);
  font: 500 19px var(--display); cursor: pointer; box-shadow: 0 4px 0 #dfaa3a;
}
.btn.alt { background: #fff; box-shadow: inset 0 0 0 2px var(--ink); min-height: 42px; font-size: 16px; }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.lvl {
  min-width: 0; padding: 7px 4px; border: 2px solid var(--ink); border-radius: 12px; background: #fff;
  color: var(--ink); font: 600 11px/1.3 var(--body); cursor: pointer; text-align: center;
}
.lvl b { display: block; font: 600 22px var(--display); }
.lvl span, .lvl em { display: block; font-style: normal; }
.lvl.done { background: #e2f6ef; }
button:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
</style>

</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat" id="money"><small id="lblA">Earned</small><b id="vMoney">$0</b></div>
    <div class="stat"><small id="lblB">Goal</small><b id="vTarget">$0</b></div>
    <div class="stat" id="rep"><small id="lblC">Quality</small><b id="vRep">★ 5/5</b></div>
    <button id="pause" class="round" type="button" aria-label="Pause">Ⅱ</button>
    <button id="mute" class="round" type="button" aria-label="Toggle sound">♪</button>
  </div>
  <div id="timebar"><div id="timefill"></div></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="foot">
        <div id="shelfwrap"><small id="vStock">Day 1</small><div id="goalbar"><div id="goalfill"></div></div></div>
  </div>
  <div id="overlay"><div id="card">
    <div id="eyebrow"></div>
    <h1 id="ctitle"></h1>
    <div id="cbody"></div>
    <div id="btns"></div>
  </div></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
  const DISPLAY = getComputedStyle(document.documentElement).getPropertyValue('--display');
  const LINE = '#2f2a33';

  const ITEM_PAY = 5, CAN_PAY = 30, REJECT_PAY = 3, CAPACITY = 6, MAX_REP = 5, REFIRE = .055, CYCLE = .2;
  const FOOD = { tomato: 'Tomato', peach: 'Peach', fish: 'Fish', mushroom: 'Mushroom' };
  // foods: what each of the three lines cans. wrong: chance a fresh item of another food strays onto a line.
  const T = 'tomato', P = 'peach', F = 'fish', M = 'mushroom';
  const DAYS = [
    { name: 'Level 1', foods: [, T], target: 205, walk: 6, gap: 1.15, bad: .34, big: 0, wrong: 0, tailgate: .1, ramp: .3, bpm: 118, time: 40,
      tip: ['Tomatoes ride the belt into the can. Rotten ones must not get in.', 'Tap when a rotten tomato is on the orange pad. You can tap as fast as you like.'] },
    { name: 'Level 2', foods: [, T], target: 235, walk: 5.6, gap: 1.1, bad: .3, big: 0, wrong: .14, pool: [P], tailgate: .1, ramp: .3, bpm: 122, time: 40,
      tip: ['Peaches have strayed onto the tomato line.', 'Fresh or not, anything that is not a tomato must go.'] },
    { name: 'Level 3', foods: [, F], target: 260, walk: 5.2, gap: 1, bad: .3, big: .18, wrong: .16, pool: [T, P], tailgate: .15, ramp: .35, bpm: 126, time: 40,
      tip: ['One line, faster, canning fish today.', 'Big rotten items pay double.'] },
    { name: 'Level 4', foods: [, T, P], target: 235, walk: 5.4, gap: 1.05, bad: .34, big: 0, wrong: 0, tailgate: .1, ramp: .3, bpm: 126, time: 40,
      tip: ['Line 2 opens: tomatoes and peaches, each with its own can.', 'Both pushers fire together, so wait until no good food is on a pad.'] },
    { name: 'Level 5', foods: [, F, P], target: 290, walk: 5, gap: .95, bad: .3, big: 0, wrong: .13, pool: [T], tailgate: .2, ramp: .35, bpm: 130, time: 40,
      tip: ['Two lines with strays.', 'Check each item against the can at the end of its own line.'] },
    { name: 'Level 6', foods: [, F, T], target: 350, walk: 4.6, gap: .85, bad: .3, big: .18, wrong: .14, pool: [P], tailgate: .25, ramp: .4, bpm: 134, time: 40,
      tip: ['Two lines at speed.', 'Rotten items may ride right behind good ones.'] },
    { name: 'Level 7', foods: [P, T, F], target: 335, walk: 4.8, gap: .85, bad: .34, big: 0, wrong: 0, tailgate: .2, ramp: .35, bpm: 136, time: 40,
      tip: ['All three lines are open.', 'Keep your eyes moving: one tap fires all three pushers.'] },
    { name: 'Level 8', foods: [F, P, T], target: 390, walk: 4.3, gap: .75, bad: .3, big: .18, wrong: .14, tailgate: .3, ramp: .4, bpm: 142, time: 40,
      tip: ['Three lines, swapped around, with strays.', 'Read the cans before you start.'] },
    { name: 'Level 9', foods: [M, P, F], target: 450, walk: 3.7, gap: .65, bad: .3, big: .22, wrong: .18, tailgate: .35, ramp: .5, bpm: 150, time: 40,
      tip: ['Rush order. Mushrooms join the line.', 'Top speed. One bad item spoils a whole can.'] }
  ];
  const LEVELS = DAYS.length;
  DAYS.push({ name: 'Battle', foods: [, T], target: 0, walk: 4.6, gap: .72, bad: .3, big: .16, wrong: .16, pool: [P, F], tailgate: .25, ramp: .7, bpm: 150, time: 60, tip: [] });
  const lines = d => d.foods.map((f, i) => f ? i : -1).filter(i => i >= 0);

  let G = {
    mode: 'menu', day: 0, list: [], floats: [], bin: [], belt: 0, rate: 1, money: 0, total: 0, rep: MAX_REP,
    time: 0, spawnIn: 0, streak: 0, sealed: 0, caught: 0, sneaked: 0, scared: 0,
    cans: [0, 0, 0].map(() => ({ fill: 0, swap: 0, ruin: 0 })), cat: { st: 'idle', t: 0 }, queued: false, kick: 0, end: ''
  };
  let L = {}, base = {}, bg = null;
  let done = [];
  try { done = JSON.parse(localStorage.getItem('can-line-done')) || []; } catch (e) {}
  const saveDone = () => { try { localStorage.setItem('can-line-done', JSON.stringify(done)); } catch (e) {} };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  // Battle: both players read the same seeded chart, so their belts carry identical items at identical times.
  const VS = { on: false, p: [], count: 0, ending: false, seed: 0, lines: 2, secs: 60 };
  function seeded(a) { return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const rnd = () => (G.rng ? G.rng() : Math.random());
  const rpick = a => a[Math.floor(rnd() * a.length)];
  function withP(i, fn) { const g = G, l = L; G = VS.p[i]; L = L.panels ? L.panels[i] : l; fn(); G = g; L = l; }
  function setMode(m) { G.mode = m; if (VS.on) for (const p of VS.p) p.mode = m; }

  /* ---------- sound: soft and light, everything synthesized ---------- */
  const S = { ac: null, master: null, music: null, sfx: null, on: true, next: 0, bar: 0, timer: 0, playing: false };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function wakeAudio() {
    try {
      if (!S.ac) {
        const ac = S.ac = new (window.AudioContext || window.webkitAudioContext)();
        S.master = ac.createDynamicsCompressor();
        S.master.connect(ac.destination);
        S.music = ac.createGain(); S.music.gain.value = .5; S.music.connect(S.master);
        S.sfx = ac.createGain(); S.sfx.gain.value = .8; S.sfx.connect(S.master);
        const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
        for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
        S.noise = buf;
      }
      if (S.ac.state === 'suspended') S.ac.resume();
      S.master.disconnect();
      if (S.on) S.master.connect(S.ac.destination);
    } catch (e) {}
  }
  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
  }
  function osc(type, f0, t, dur, peak, out, f1 = 0, a = .006) {
    const o = S.ac.createOscillator(), g = S.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, a, peak, dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + a + dur + .02);
  }
  function puff(t, dur, peak, freq) {
    const src = S.ac.createBufferSource(), f = S.ac.createBiquadFilter(), g = S.ac.createGain();
    src.buffer = S.noise; f.type = 'lowpass'; f.frequency.value = freq;
    env(g, t, .01, peak, dur);
    src.connect(f).connect(g).connect(S.sfx); src.start(t, Math.random(), dur + .05);
  }
  const sfx = fn => (...a) => { if (S.ac) fn(S.ac.currentTime, ...a); };
  const SFX = {
    bell: sfx(t => { osc('sine', 1760, t, .35, .035, S.sfx); osc('sine', 2217, t + .08, .4, .03, S.sfx); }),
    till: sfx(t => { osc('sine', 1319, t, .16, .04, S.sfx); osc('sine', 1976, t + .08, .3, .04, S.sfx); }),
    pon: sfx(t => { osc('sine', 520, t, .13, .12, S.sfx, 200); puff(t, .08, .04, 900); }),
    bonk: sfx((t, v = 1) => { osc('sine', 240, t, .09, .13 * v, S.sfx, 95); puff(t, .05, .05 * v, 700); }),
    piston: sfx(t => { osc('square', 150, t, .05, .05, S.sfx, 90); puff(t, .1, .1, 2400); }),
    thunk: sfx(t => { osc('sine', 170, t, .12, .22, S.sfx, 60); puff(t, .06, .08, 800); }),
    plop: sfx(t => { osc('sine', 300, t, .1, .06, S.sfx, 620); }),
    sour: sfx(t => { osc('sawtooth', 233, t, .24, .05, S.sfx); osc('sawtooth', 247, t, .24, .05, S.sfx); }),
    buzz: sfx((t, v = .02) => { osc('sawtooth', 190, t, .22, v, S.sfx, 230); }),
    squeak: sfx((t, vol = .05) => { osc('sine', 2100, t, .06, vol, S.sfx, 2800); osc('sine', 2400, t + .09, .07, vol * .8, S.sfx, 3000); }),
    combo: sfx((t, n) => { const r = Math.pow(2, Math.min(n, 7) * 2 / 12); osc('sine', 880 * r, t, .14, .05, S.sfx); osc('sine', 1320 * r, t + .08, .2, .05, S.sfx); }),
    meow: sfx((t, up = 1) => {
      const f = S.ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(1000, t);
      f.frequency.linearRampToValueAtTime(1900, t + .12); f.frequency.linearRampToValueAtTime(900, t + .3); f.Q.value = 3; f.connect(S.sfx);
      const o = S.ac.createOscillator(), g = S.ac.createGain(); o.type = 'triangle';
      o.frequency.setValueAtTime(560 * up, t); o.frequency.linearRampToValueAtTime(760 * up, t + .11); o.frequency.linearRampToValueAtTime(470 * up, t + .3);
      env(g, t, .03, .32, .26); o.connect(g).connect(f); o.start(t); o.stop(t + .34);
    }),
    oops: sfx(t => { osc('sine', 660, t, .14, .07, S.sfx, 520); osc('sine', 494, t + .13, .22, .07, S.sfx, 400); }),
    munch: sfx(t => { for (const d of [0, .11]) puff(t + d, .04, .04, 2600); }),
    sneak: sfx(t => { osc('sine', 988, t, .1, .06, S.sfx); osc('sine', 740, t + .1, .1, .06, S.sfx); osc('sine', 587, t + .2, .2, .06, S.sfx); })
  };
  const CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62], [60, 64, 67], [52, 55, 59], [53, 57, 60], [55, 59, 62]];
  const TUNE = [
    [[76, 1], [79, 1], [84, 1]], [[81, 2], [76, 1]], [[77, 1], [81, 1], [79, 1]], [[74, 2], [71, 1]],
    [[72, 1], [76, 1], [79, 1]], [[83, .5], [84, .5], [83, 1], [79, 1]], [[77, 1], [76, 1], [74, 1]], [[79, 3]]
  ];
  function scheduleBar(t, bar, beatLen) {
    const ch = CHORDS[bar % 8];
    osc('triangle', hz(ch[0] - 12), t, beatLen * .9, .16, S.music);
    for (const k of [1, 2]) for (const m of ch) osc('triangle', hz(m), t + k * beatLen, beatLen * .3, .035, S.music);
    let b = 0;
    for (const [m, len] of TUNE[bar % 8]) {
      const on = t + b * beatLen, up = bar % 16 >= 8 ? 12 : 0;
      osc('sine', hz(m + up), on, len * beatLen * 1.1, .085, S.music);
      osc('sine', hz(m + up) * 3, on, .18, .018, S.music);
      b += len;
    }
  }
  function musicTick() {
    if (!S.ac || !S.playing) return;
    const day = DAYS[G.day], rush = G.mode === 'play' && G.time < 10 ? 10 : 0, beatLen = 60 / (day.bpm + rush);
    while (S.next < S.ac.currentTime + .25) { scheduleBar(S.next, S.bar, beatLen); S.next += beatLen * 3; S.bar++; }
  }
  function startMusic() {
    if (!S.ac) return;
    S.music.gain.setTargetAtTime(.5, S.ac.currentTime, .1);
    if (S.playing) return;
    S.playing = true; S.bar = 0; S.next = S.ac.currentTime + .08;
    S.timer = setInterval(musicTick, 60);
  }
  function quietMusic() { if (S.ac) S.music.gain.setTargetAtTime(.2, S.ac.currentTime, .25); }





  /* ---------- line ---------- */
  const at = (p, route) => ({ x: L.startX + (L.endX - L.startX) * Math.max(0, Math.min(1, p)), y: L.lanes[route] });
  const zone = () => ({ x0: L.zc - L.zoneW / 2, x1: L.zc + L.zoneW / 2, x: L.zc, w: L.zoneW });
  function inZone(e) {
    if (e.st !== 'walk') return false;
    const q = at(e.p, e.route), z = zone();
    return q.x >= z.x0 && q.x <= z.x1;
  }
  // 0 at rest, 1 fully out. The stroke is almost instant; firing again simply restarts it.
  function paddle() {
    const c = G.cat;
    if (c.st !== 'jump') return 0;
    if (c.t < .045) { const k = c.t / .045; return 1 - (1 - k) * (1 - k); }
    if (c.t < .07) return 1;
    return Math.max(0, 1 - (c.t - .07) / (CYCLE - .07));
  }

  /* ---------- simulation ---------- */
  function spawn() {
    const day = DAYS[G.day], route = rpick(lines(day)), food = day.foods[route], roll = rnd();
    let kind = 'good', type = food;
    if (roll < day.bad) kind = rnd() < day.big ? 'big' : 'bad';
    else if (roll < day.bad + day.wrong) { kind = 'wrong'; type = rpick((day.pool || [T, P, F]).filter(f => f !== food)); }
    G.list.push({ kind, st: 'walk', p: 0, route, type, seed: rnd() * 10, walk: day.walk * L.walkK * (.98 + rnd() * .04),
      size: kind === 'big' ? 1.3 : .94 + rnd() * .12, spin: (rnd() < .5 ? -1 : 1) * (1 + rnd()), t: 0, off: 0, vo: 0 });
    return kind !== 'good';
  }
  function beginDay(i) {
    const day = DAYS[i];
    Object.assign(G, { day: i, list: [], floats: [], bin: [], belt: 0, rate: 1, money: 0, rep: MAX_REP, time: day.time, spawnIn: .2,
      streak: 0, sealed: 0, caught: 0, sneaked: 0, scared: 0, cat: { st: 'idle', t: 0 }, queued: false, kick: 0,
      cans: [0, 0, 0].map(() => ({ fill: 0, swap: 0, ruin: 0 })) });
    for (let n = 0; n < 3; n++) { spawn(); const e = G.list[n]; e.p = Math.max(0, .46 - n * day.gap / (day.walk * L.walkK)); }
  }
  function float(text, color, x, y) { G.floats.push({ text, color, x, y, t: 1, size: 17 }); }
  function bump(id) { const el = $(id); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

  function fire() {
    const hit = G.list.filter(inZone), bad = hit.filter(e => e.kind !== 'good'), good = hit.filter(e => e.kind === 'good');
    G.cat = { st: 'jump', t: 0 }; G.queued = false;
    SFX.piston();
    if (hit.length) { SFX.thunk(); G.kick = .07; }
    for (const e of hit) { const q = at(e.p, e.route); e.st = 'pushed'; e.x = q.x; e.face = q.y; e.off = 0; e.vo = 900; e.t = 0; }
    if (bad.length) {
      G.streak += bad.length; SFX.combo(G.streak);
      for (const e of bad) {
        const pay = (REJECT_PAY + Math.min(G.streak - 1, 5)) * (e.kind === 'big' ? 2 : 1);
        G.money += pay; G.total += pay; G.caught++;
        float('+$' + pay, '#b8780f', e.x, e.face - 46);
      }
      bump('money');
    }

      const half = ctx.measureText(f.text).width / 2 + 10, x = Math.max(half + 4, Math.min(L.W - half - 4, f.x)), y = f.y - (1 - f.t) * 16, ph = f.size + 10;
      rr(ctx, x - half, y - ph + 6, half * 2, ph, ph / 2); ink(ctx, '#fbf6e9', 2.4);

      const [a, b] = VS.p, sum = a.money + b.money;

      put('vMoney', '$' + a.money); put('vTarget', Math.ceil(Math.max(0, G.time)) + 's'); put('vRep', '$' + b.money);
      put('vStock', 'Left: A key or tap left · Right: L key or tap right · Line speed ×' + G.rate.toFixed(1));
      $('goalfill').style.transform = 'scaleX(' + (sum ? a.money / sum : .5).toFixed(3) + ')';
      $('timefill').style.transform = 'scaleX(' + pct.toFixed(3) + ')';
      return;
    }
    put('lblA', 'Earned'); put('lblB', 'Goal'); put('lblC', 'Quality');
    put('vMoney', '$' + G.money); put('vTarget', '$' + d.target); put('vRep', '★ ' + Math.max(0, G.rep) + '/' + MAX_REP);
    put('vStock', d.name + ' · Line speed ×' + G.rate.toFixed(1) + ' · Space to tap, P to pause');
    $('goalfill').style.transform = 'scaleX(' + Math.min(1, G.money / d.target).toFixed(3) + ')';
    $('timefill').style.transform = 'scaleX(' + pct.toFixed(3) + ')';
    $('timefill').style.background = pct < .2 ? '#ff8a6b' : '#6fd6c1';
  }

  /* ---------- loop ---------- */
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
    if (VS.on) {
      if (VS.count > 0) { VS.count -= dt; const b = Math.ceil(VS.count); if (b !== VS.beat) { VS.beat = b; SFX.piston(); } if (VS.count <= 0) setMode('play'); }
      else if (G.mode === 'play' && !document.hidden) {
        VS.p.forEach((p, i) => withP(i, () => step(dt)));
        if (VS.ending) endBattle();
      }
    } else if (G.mode === 'play' && !document.hidden) step(dt);
    draw(now / 1000); hud();
    requestAnimationFrame(frame);
  }
  const IMG = {};
  addEventListener('resize', resize);
  addEventListener('orientationchange', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  resize();
  showLevels();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (L.W) paintBackground(); });
  const names = 'tomato peach fish mushroom tomato_bad peach_bad fish_bad mushroom_bad can_tomato can_peach can_fish can_mushroom dumpster'.split(' ');
  let waiting = names.length;
  for (const n of names) {
    const im = IMG[n] = new Image();
    im.onload = im.onerror = () => { if (--waiting === 0) resize(); };
    im.src = 'cannery/' + n + '.png';
  }
  const floor = IMG.floor = new Image(); floor.onload = () => { if (L.W) paintBackground(); }; floor.src = 'cannery/floor.jpg';
  requestAnimationFrame(frame);
  if (location.hash === '#debug') window.__shop = { get G() { return G; }, step, DAYS, VS, showBrief, showLevels, showBattle, startBattle, withP, pounce, inZone };
})();
